<div
    (click)="openTicketForm()"
    cdkDrag
    [attr.id]="ticketCard.id"
    class="cdk-drag"
    (cdkDragStarted)="onDragStarted($event)"
>
    <div class="example-custom-placeholder" *cdkDragPlaceholder
         [ngStyle]="{'height.px': elementHeight}"
    ></div>
    <div
        cdkDragHandle
        class="cdk-drag-handle flex bg-surface-0 dark:bg-surface-900 flex-col w-full border border-surface p-4 gap-4 hover:bg-surface-50 dark:hover:bg-surface-950 cursor-pointer rounded-border"
    >
        <!-- Title + Menu -->
        <div class="flex justify-between items-center">
            <span class="text-surface-900 dark:text-surface-0 font-semibold">
            {{ ticketCard.title }}
                <div class="tags flex gap-2 items-center">
                  <p-tag severity="success" styleClass="custom-tag">
                    <span>Success</span>
                    <i class="pi pi-times close-icon" (click)="removeTag(ticketCard, 'Success')"></i>
                  </p-tag>
                  <p-tag severity="info" styleClass="custom-tag">
                    <span>Info</span>
                    <i class="pi pi-times close-icon" (click)="removeTag(ticketCard, 'Info')"></i>
                  </p-tag>
                  <p-tag severity="warn" styleClass="custom-tag">
                    <span>Warn</span>
                    <i class="pi pi-times close-icon" (click)="removeTag(ticketCard, 'Warn')"></i>
                  </p-tag>
                </div>
            </span>
            <div>
                <p-menu #menu [model]="items" [popup]="true"></p-menu>
                <p-button
                    icon="pi pi-ellipsis-v"
                    rounded
                    text
                    severity="secondary"
                    class="p-ripple p-trigger p-button p-component p-button-icon-only p-button-text p-button-secondary p-button-rounded"
                    (onClick)="menu.toggle($event)"
                >
                </p-button>
            </div>
        </div>
        <!-- Description -->
        <div
            class="text-surface-700 dark:text-surface-100"
            style="word-break: break-word;"
            *ngIf="ticketCard.description"
        >
            {{ ticketCard.description }}
        </div>
        <!-- Bottom row: Avatars, stats, etc. -->
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <p-avatar-group *ngIf="ticketCard.assignedUsers?.length">
                    <p-avatar *ngFor="let user of ticketCard.assignedUsers"
                              [label]="user.avatar"
                              [style]="{'background-color': '#2196f3', 'color': '#fff'}"
                              shape="circle"
                              tooltipPosition="top">
                    </p-avatar>
                </p-avatar-group>
            </div>
            <div class="text-sm text-surface-500">
                {{ ticketCard.creationDate | date: 'short' }}
            </div>
        </div>
    </div>
</div>
