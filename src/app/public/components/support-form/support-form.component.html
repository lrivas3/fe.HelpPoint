<app-floating-configurator [showPalette]="false"></app-floating-configurator>
<p-fluid style="width: 100rem">
    <!-- Contenedor principal -->
    <div
        class="bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 mx-auto w-full max-w-5xl align-middle"
        style="border-radius: 20px"
    >
        <div class="text-center mb-8">
            <app-svg-icon></app-svg-icon>
            <div
                class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4 mt-8"
            >
                Formulario de solicitud de soporte
            </div>
        </div>

        <form (ngSubmit)="sendSRequest()" #form="ngForm">
            <div class="flex mt-8 items-center">
                <div class="card flex flex-col gap-6 w-full">

                    <!-- Email del usuario -->
                    <div class="mt-6 col-span-12">
                        <div class="flex flex-wrap gap-2 w-full">
                            <label
                                for="correo-usuario"
                                class="block text-surface-700 dark:text-surface-200 font-medium mb-1"
                            >
                                Correo de usuario
                            </label>
                            <input
                                pInputText
                                id="correo-usuario"
                                name="email"
                                type="email"
                                required
                                [(ngModel)]="supportRequest.email"
                                class="w-full p-3 border border-solid border-surface-300 dark:border-surface-700 rounded"
                            />
                        </div>
                    </div>

                    <!-- Descripción del problema -->
                    <div class="flex flex-wrap">
                        <label
                            for="descripcion"
                            class="block text-surface-700 dark:text-surface-200 font-medium mb-1"
                        >
                            Describa su problema
                        </label>
                        <textarea
                            pTextarea
                            id="descripcion"
                            name="descripcion"
                            rows="4"
                            required
                            [(ngModel)]="supportRequest.descripcion"
                            class="w-full p-3 border border-solid border-surface-300 dark:border-surface-700 rounded"
                        ></textarea>
                    </div>

                    <!-- Área de subida de archivos -->
                    <p-fileupload
                        name="demo[]"
                        url=""
                        (onUpload)="onUpload($event)"
                        [multiple]="true"
                        accept="image/*"
                        maxFileSize="1000000"
                    >
                        <ng-template
                            #header
                            let-files
                            let-chooseCallback="chooseCallback"
                            let-clearCallback="clearCallback"
                            let-uploadCallback="uploadCallback"
                        >
                            <div class="flex flex-wrap justify-between items-center flex-1 gap-4">
                                <div class="flex gap-2">
                                    <p-button
                                        (onClick)="choose({ event: $event, callback: chooseCallback })"
                                        icon="pi pi-images"
                                        [rounded]="true"
                                        [outlined]="true"
                                    ></p-button>
                                    <p-button
                                        (onClick)="clearCallback()"
                                        icon="pi pi-times"
                                        [rounded]="true"
                                        [outlined]="true"
                                        severity="danger"
                                        [disabled]="!files || files.length === 0"
                                    ></p-button>
                                </div>
                            </div>
                        </ng-template>
                        <ng-template #empty>
                            <div>Arrastre archivos aquí para subirlos</div>
                        </ng-template>
                        <ng-template #content>
                            <ul *ngIf="uploadedFiles.length">
                                <li *ngFor="let file of uploadedFiles">
                                    {{ file.name }} — {{ file.size }} bytes
                                </li>
                            </ul>
                        </ng-template>
                    </p-fileupload>

                    <!-- reCAPTCHA -->
                    <div class="flex justify-center w-full max-w-xs mx-auto overflow-visible scale-90 sm:scale-100">
                        <re-captcha
                            (resolved)="executeRecaptcha($event)"
                            [siteKey]="siteKey"
                        ></re-captcha>
                    </div>

                    <!-- Botón de envío -->
                    <div class="flex justify-center mt-6">
                        <button
                            pButton
                            type="submit"
                            label="Enviar solicitud"
                            icon="pi pi-send font-semibold"
                            class="p-ripple py-4 font-semibold w-full max-w-sm rounded p-button p-component"
                            [disabled]="loading || form.invalid"
                        ></button>
                    </div>

                </div>
            </div>
        </form>
    </div>
</p-fluid>
